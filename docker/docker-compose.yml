services:
  mysql57:
    image: mysql:5.7
    container_name: mysql57
    restart: "no"

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 12345

    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --slow-query-log=ON
      - --slow-query-log-file=/var/lib/mysql/mysql-slow.log
      - --long-query-time=10

    volumes:
      - mysql57_data:/var/lib/mysql

volumes:
  mysql57_data:
